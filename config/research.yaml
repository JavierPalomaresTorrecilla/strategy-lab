# Research-phase configuration defaults for strategy-lab.
#
# This file governs offline, historical research and simulation only.
# It has no connection to any live or paper-trading execution path
# (none exists yet — see config/risk.yaml and README.md).

project:
  phase: "research"          # research | validation (no "production" phase exists yet)
  random_seed: 42            # fixed seed for reproducibility of any stochastic step

data:
  # Real datasets (raw provider snapshots, processed/canonical snapshots)
  # live exclusively under the external directory named by the
  # STRATEGY_LAB_DATA_ROOT environment variable (see strategy_lab.data.env)
  # -- never inside this repository. There is no repo-local data path here
  # on purpose, so this file does not become a second source of truth for
  # dataset location.
  #
  # Data source adapters are not implemented yet. When added, they must
  # document survivorship-bias handling and point-in-time availability.

splits:
  # Single source of truth for chronological partition boundaries.
  # `strategy_lab.data.splits` loads and validates this list; it does not
  # duplicate these dates in Python. Boundaries are half-open:
  # start <= timestamp < end.
  #
  # TEST is methodologically sealed for Milestone 2: it is loaded and
  # validated like the others, but no real-data strategy result, return,
  # trade, or equity value may be computed on it until an explicitly
  # authorized final evaluation (see strategy_lab.data.splits and
  # scripts/run_parity_report.py).
  schema_version: 1
  partitions:
    - name: train
      start: "2010-01-01"
      end: "2019-01-01"
    - name: validation
      start: "2019-01-01"
      end: "2023-01-01"
    - name: test
      start: "2023-01-01"
      end: "2026-01-01"

costs:
  # Placeholder assumptions only. Must be replaced with instrument- and
  # venue-specific figures before any backtest result is treated as
  # informative.
  commission_bps: 0.0
  slippage_bps: 0.0
  spread_bps: 0.0

experiments:
  registry_path: "experiments/registry.csv"
  # Every experiment run should be recorded in the registry with its
  # hypothesis, parameters, data range, and outcome.

backtest:
  # Illustrative research defaults only — not a claim that these values are
  # realistic for any specific instrument, venue, or account size.
  initial_cash: 100000.0
  # Execution convention (see strategy_lab.backtest.engine for the exact
  # semantics and rationale): a signal known at a bar's close executes no
  # earlier than the following bar's open. This is fixed engine behavior,
  # not a configurable option, so it is documented rather than parameterized.
  execution_timing: "next_bar_open"
